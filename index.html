<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quer namorar comigo?</title>
  <style>
    body {
      background-color: #ffe6e6;
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      color: #ff4d4d;
      font-size: 2.5rem;
    }

    button {
      padding: 15px 30px;
      margin: 20px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    #sim {
      background-color: #4CAF50;
      color: white;
    }

    #nao {
      background-color: #f44336;
      color: white;
      position: relative;
    }

    #mensagem {
      margin-top: 50px;
      font-size: 1.8rem;
      color: #cc0066;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Ana Maria, você quer namorar comigo?</h1>
  <button id="sim">Sim</button>
  <button id="nao">Não</button>

  <div id="mensagem">Sabia que você é meu bug favorito nesse sistema chamado vida.</div>

  <script>
    const simBtn = document.getElementById("sim");
    const naoBtn = document.getElementById("nao");
    const mensagem = document.getElementById("mensagem");

    simBtn.addEventListener("click", () => {
      mensagem.style.display = "block";
    });

    naoBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      naoBtn.style.position = "absolute";
      naoBtn.style.left = ${x}px;
      naoBtn.style.top = ${y}px;
    });
  </script>
</body>
</html>
