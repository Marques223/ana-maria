<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ana Maria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #fff0f5;
    }

    h1 {
      color: #d63384;
    }

    #buttons {
      margin-top: 30px;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background-color: #ff69b4;
      color: white;
      transition: 0.2s;
    }

    #mensagem {
      margin-top: 40px;
      font-size: 22px;
      color: #800080;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Ana Maria, você quer namorar comigo?</h1>
  <div id="buttons">
    <button onclick="responderSim()">Sim</button>
    <button id="nao" onmouseover="fugir()">Não</button>
  </div>
  <div id="mensagem">Sabia que você é meu bug favorito nesse sistema chamado vida.</div>

  <script>
    function fugir() {
      const btnNao = document.getElementById('nao');
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      btnNao.style.position = 'absolute';
      btnNao.style.left = x + 'px';
      btnNao.style.top = y + 'px';
    }

    function responderSim() {
      document.getElementById('mensagem').style.display = 'block';
    }
  </script>
</body>
</html>
