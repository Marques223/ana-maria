<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ana Maria</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pacifico', cursive;
      text-align: center;
      margin-top: 100px;
      background: linear-gradient(120deg, #ffc0cb, #dda0dd);
      color: #4b0082;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 40px;
    }

    #buttons {
      margin-top: 30px;
    }

    button {
      font-size: 20px;
      padding: 12px 30px;
      margin: 10px;
      cursor: pointer;
      border-radius: 30px;
      border: none;
      background-color: #ff69b4;
      color: white;
      transition: transform 0.2s, background-color 0.2s;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #ff1493;
    }

    #mensagem {
      margin-top: 50px;
      font-size: 24px;
      color: #800080;
      display: none;
    }

    .coração {
      font-size: 40px;
      margin-bottom: 10px;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="coração">❤️</div>
  <h1>Ana Maria, você quer namorar comigo?</h1>
  <div id="buttons">
    <button onclick="responderSim()">Sim</button>
    <button id="nao" onmouseover="fugir()">Não</button>
  </div>
  <div id="mensagem">Sabia que você é meu bug favorito nesse sistema chamado vida?</div>

  <script>
    function fugir() {
      const btnNao = document.getElementById('nao');
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      btnNao.style.position = 'absolute';
      btnNao.style.left = x + 'px';
      btnNao.style.top = y + 'px';
    }

    function responderSim() {
      document.getElementById('mensagem').style.display = 'block';
    }
  </script>
</body>
</html>
